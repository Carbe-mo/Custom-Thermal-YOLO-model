# models/farooq_2022_yolov5/model.yaml
# ==============================================================================
# Thermal-YOLO (YOLOv5 C3-CSP Architecture for Embedded GPU Platforms)
# M. A. Farooq, W. Shariff, and P. Corcoran,
# "Evaluation of thermal imaging on embedded GPU platforms for application in
# vehicular assistance systems", IEEE Transactions on Intelligent Vehicles,
# vol. 8, no. 2, pp. 1130-1144, 2022 (arXiv:2201.01661).
#
# Uses YOLOv5 C3 CSPDarknet53 backbone + PANet neck (trained with SGD optimizer).
# ==============================================================================

nc: 4
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 6, 2, 2]]   # 0-P1/2 (6x6 stem conv as in YOLOv5)
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C3, [128]]             # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C3, [256]]             # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 9, C3, [512]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C3, [1024]]            # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  - [-1, 1, Conv, [512, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]      # cat backbone P4
  - [-1, 3, C3, [512, False]]      # 13

  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 3, C3, [256, False]]      # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]     # cat head P4
  - [-1, 3, C3, [512, False]]      # 20 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]     # cat head P5
  - [-1, 3, C3, [1024, False]]     # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]]  # Detect(P3, P4, P5)
