# v11_c2f_eca_deep — YOLOv8n with deepened C2f_ECA backbone stages (n=[2, 3, 3, 2])
nc: 4
scales:
  n: [0.33, 0.25, 1024]

# YOLOv8.0n backbone with deepened C2f_ECA stages
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 6, C2f_ECA, [128, True]]      # 2 (n=2 @ P2)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 9, C2f_ECA, [256, True]]      # 4 (n=3 @ Backbone P3)
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 9, C2f_ECA, [512, True]]      # 6 (n=3 @ Backbone P4)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 6, C2f_ECA, [1024, True]]     # 8 (n=2 @ P5)
  - [-1, 1, SPPF, [1024, 5]]           # 9 (Backbone P5)

# YOLOv8.0n head (clean linear multiscale PANet)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11-cat backbone P4
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14-cat backbone P3
  - [-1, 3, C2f, [256]]                         # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17-cat head P4
  - [-1, 3, C2f, [512]]                         # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 9], 1, Concat, [1]]                   # 20-cat head P5
  - [-1, 3, C2f, [1024]]                        # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]             # 22-Detect(P3, P4, P5)
