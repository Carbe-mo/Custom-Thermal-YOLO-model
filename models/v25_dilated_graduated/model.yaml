# v25_dilated_graduated — YOLOv8n with Graduated Dilation ECA Bottlenecks
# Stage-selective receptive field pyramid:
#   P2 (d=1): standard 3×3 ECA — fine boundary detection
#   P3 (d=1): standard 3×3 ECA — small person detection  
#   P4 (d=2): 5×5 effective RF — medium context
#   P5 (d=3): 7×7 effective RF — large semantic context
# All dilation modes use identical 3×3 kernel tensor shapes → full yolov8n.pt transfer
nc: 4
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args=[channels, shortcut, g, e, eca_k, dilation]]
  - [-1, 1, Conv, [64, 3, 2]]                              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                             # 1-P2/4
  - [-1, 3, C2f_ECA_Graduated, [128, True, 1, 0.5, 3, 1]] # 2 — d=1 standard (fine edges)
  - [-1, 1, Conv, [256, 3, 2]]                             # 3-P3/8
  - [-1, 6, C2f_ECA_Graduated, [256, True, 1, 0.5, 3, 1]] # 4 — d=1 standard (small persons)
  - [-1, 1, Conv, [512, 3, 2]]                             # 5-P4/16
  - [-1, 6, C2f_ECA_Graduated, [512, True, 1, 0.5, 3, 2]] # 6 — d=2 medium context
  - [-1, 1, Conv, [1024, 3, 2]]                            # 7-P5/32
  - [-1, 3, C2f_ECA_Graduated, [1024, True, 1, 0.5, 3, 3]]# 8 — d=3 large semantic context
  - [-1, 1, SPPF, [1024, 5]]                               # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14
  - [-1, 3, C2f, [256]]                         # 15

  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17
  - [-1, 3, C2f, [512]]                         # 18

  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 9], 1, Concat, [1]]                   # 20
  - [-1, 3, C2f, [1024]]                        # 21

  - [[15, 18, 21], 1, Detect, [nc]]             # 22
