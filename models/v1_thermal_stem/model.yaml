# v1_thermal_stem — YOLOv8n with Thermal-Aware Contrast Stem (ThermalStem)
#
# Modifications vs v0_baseline:
#   Layer 0 replaced from stock `Conv(64, 3, 2)` to `ThermalStem(64, 3, 2)`.
#   Everything else (backbone C2f blocks, SPPF, PANet neck, Detect head) is identical.
#
# Parameters:
#   nc: 4 (person, trolley, bag, unattended)
#   scale: n (depth: 0.33, width: 0.25, max_channels: 1024)

nc: 4
scales:
  n: [0.33, 0.25, 1024]

# YOLOv8.0n backbone with ThermalStem
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ThermalStem, [64, 3, 2]]  # 0-P1/2 (Thermal-Aware 2-Stage Stem)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]           # 9

# YOLOv8.0n head (identical to v0_baseline)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]          # cat backbone P4
  - [-1, 3, C2f, [512]]                # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]          # cat backbone P3
  - [-1, 3, C2f, [256]]                # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]         # cat head P4
  - [-1, 3, C2f, [512]]                # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]          # cat head P5
  - [-1, 3, C2f, [1024]]               # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]    # Detect(P3, P4, P5)
