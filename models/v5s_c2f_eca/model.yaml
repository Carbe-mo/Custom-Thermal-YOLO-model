# v5s_c2f_eca — YOLOv8s with C2f_ECA Backbone (Scale 's' with 2x Channel Dimension Capacity)
nc: 4
depth_multiple: 0.33
width_multiple: 0.50
max_channels: 1024

# YOLOv8s backbone with C2f_ECA
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2 (32 ch)
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4 (64 ch)
  - [-1, 3, C2f_ECA, [128, True]]      # 2 (C2f_ECA @ P2, 64 ch)
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8 (128 ch)
  - [-1, 6, C2f_ECA, [256, True]]      # 4 (C2f_ECA @ Backbone P3, 128 ch)
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16 (256 ch)
  - [-1, 6, C2f_ECA, [512, True]]      # 6 (C2f_ECA @ Backbone P4, 256 ch)
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32 (512 ch)
  - [-1, 3, C2f_ECA, [1024, True]]     # 8 (C2f_ECA @ P5, 512 ch)
  - [-1, 1, SPPF, [1024, 5]]           # 9 (Backbone P5, 512 ch)

# YOLOv8s head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11-cat backbone P4 (512 ch)
  - [-1, 3, C2f, [512]]                         # 12 (256 ch)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14-cat backbone P3 (256 ch)
  - [-1, 3, C2f, [256]]                         # 15 (128 ch, P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 16 (128 ch)
  - [[-1, 12], 1, Concat, [1]]                  # 17-cat head P4 (384 ch)
  - [-1, 3, C2f, [512]]                         # 18 (256 ch, P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 19 (256 ch)
  - [[-1, 9], 1, Concat, [1]]                   # 20-cat head P5 (768 ch)
  - [-1, 3, C2f, [1024]]                        # 21 (512 ch, P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]             # 22-Detect(P3, P4, P5)
