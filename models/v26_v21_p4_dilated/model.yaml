# v26_v21_p4_dilated — YOLOv8n with Dilation (d=2) ONLY at P4
# P2, P3, P5 use standard C2f_ECA (P5 is followed by SPPF so standard 3x3 avoids conflicting with SPPF pooling)
nc: 4
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]              # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]             # 1-P2/4
  - [-1, 3, C2f_ECA, [128, True]]          # 2 (C2f_ECA standard @ P2)
  - [-1, 1, Conv, [256, 3, 2]]             # 3-P3/8
  - [-1, 6, C2f_ECA, [256, True]]          # 4 (C2f_ECA standard @ P3)
  - [-1, 1, Conv, [512, 3, 2]]             # 5-P4/16
  - [-1, 6, C2f_ECA_Dilated, [512, True]]  # 6 (C2f_ECA_Dilated d=2 @ P4 — context only at P4)
  - [-1, 1, Conv, [1024, 3, 2]]            # 7-P5/32
  - [-1, 3, C2f_ECA, [1024, True]]         # 8 (C2f_ECA standard @ P5 — clean feed into SPPF)
  - [-1, 1, SPPF, [1024, 5]]               # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11-cat backbone P4
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14-cat backbone P3
  - [-1, 3, C2f, [256]]                         # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17-cat head P4
  - [-1, 3, C2f, [512]]                         # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 9], 1, Concat, [1]]                   # 20-cat head P5
  - [-1, 3, C2f, [1024]]                        # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]             # 22-Detect(P3, P4, P5)
