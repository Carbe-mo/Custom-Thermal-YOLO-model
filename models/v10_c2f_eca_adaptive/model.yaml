# v10_c2f_eca_adaptive — YOLOv8n with Adaptive Kernel ECA in Backbone Bottlenecks
nc: 4
scales:
  n: [0.33, 0.25, 1024]

# YOLOv8.0n backbone with C2f_ECA_Adaptive
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                 # 1-P2/4
  - [-1, 3, C2f_ECA_Adaptive, [128, True]]     # 2 (k=3 @ P2)
  - [-1, 1, Conv, [256, 3, 2]]                 # 3-P3/8
  - [-1, 6, C2f_ECA_Adaptive, [256, True]]     # 4 (k=3 @ P3)
  - [-1, 1, Conv, [512, 3, 2]]                 # 5-P4/16
  - [-1, 6, C2f_ECA_Adaptive, [512, True]]     # 6 (k=5 @ P4)
  - [-1, 1, Conv, [1024, 3, 2]]                # 7-P5/32
  - [-1, 3, C2f_ECA_Adaptive, [1024, True]]    # 8 (k=5 @ P5)
  - [-1, 1, SPPF, [1024, 5]]                   # 9 (Backbone P5)

# YOLOv8.0n head (clean linear multiscale PANet)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, Concat, [1]]                   # 11-cat backbone P4
  - [-1, 3, C2f, [512]]                         # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14-cat backbone P3
  - [-1, 3, C2f, [256]]                         # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17-cat head P4
  - [-1, 3, C2f, [512]]                         # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 9], 1, Concat, [1]]                   # 20-cat head P5
  - [-1, 3, C2f, [1024]]                        # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]             # 22-Detect(P3, P4, P5)
