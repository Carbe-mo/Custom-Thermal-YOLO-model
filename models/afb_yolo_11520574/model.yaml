# models/afb_yolo_11520574/model.yaml
# Paper 11520574 (DOI 10.1109/JSEN.2026.3691670):
# Lade, Bethi, Cenkeramaddi, "Thermal Imaging-based Perception for Automotive Edge AI
# Applications using a Lightweight Custom YOLO Model", IEEE Sensors Journal, 2026.
# Replaces YOLOv8 backbone C2f blocks with Attention Fusion Block (AFB: 5x5 DW inverted residual + ECA + CA).

nc: 4
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]   # 1-P2/4
  - [-1, 3, AFB, [128]]          # 2-P2/4 (AFB replaces C2f)
  - [-1, 1, Conv, [256, 3, 2]]   # 3-P3/8
  - [-1, 6, AFB, [256]]          # 4-P3/8 (AFB replaces C2f)
  - [-1, 1, Conv, [512, 3, 2]]   # 5-P4/16
  - [-1, 6, AFB, [512]]          # 6-P4/16 (AFB replaces C2f)
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, AFB, [1024]]         # 8-P5/32 (AFB replaces C2f)
  - [-1, 1, SPPF, [1024, 5]]     # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]    # cat backbone P4
  - [-1, 3, C2f, [512]]          # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]    # cat backbone P3
  - [-1, 3, C2f, [256]]          # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]   # cat head P4
  - [-1, 3, C2f, [512]]          # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]    # cat head P5
  - [-1, 3, C2f, [1024]]         # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]  # Detect(P3, P4, P5)
