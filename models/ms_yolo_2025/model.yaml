# models/ms_yolo_2025/model.yaml
# ==============================================================================
# MS-YOLO: Infrared Object Detection for Edge Deployment via MobileNetV4 and SlideLoss
# Jiali Zhang et al., 2025 International Joint Conference on Neural Networks (IJCNN), pp. 1-8, 2025.
#
# Replaces YOLOv8n's CSPDarknet backbone with MobileNetV4-Small (Conv2D stem + UIBs-1 & UIBs-2)
# while retaining the YOLOv8n PANet neck and Detect head, trained with SlideLoss (6.7 GFLOPs).
# ==============================================================================

nc: 4
scales:
  n: [0.33, 0.25, 1280]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvBNReLU6, [64, 3, 2]]    # 0-P1/2  (16 ch)
  - [-1, 1, ConvBNReLU6, [64, 3, 2]]    # 1-P2/4  (16 ch)
  - [-1, 1, ConvBNReLU6, [64, 1, 1]]    # 2-P2/4  (16 ch)
  - [-1, 1, ConvBNReLU6, [192, 3, 2]]   # 3-P3/8  (48 ch)
  - [-1, 1, ConvBNReLU6, [128, 1, 1]]   # 4-P3/8  (32 ch)  -> P3 skip to Neck
  - [-1, 1, UIBs1, [256]]               # 5-P4/16 (64 ch)  -> P4 skip to Neck
  - [-1, 1, UIBs2, [512]]               # 6-P5/32 (128 ch)
  - [-1, 1, ConvBNReLU6, [960, 1, 1]]   # 7-P5/32 (240 ch)
  - [-1, 1, ConvBNReLU6, [1280, 1, 1]]  # 8-P5/32 (320 ch)
  - [-1, 1, SPPF, [1024, 5]]            # 9-P5/32 (256 ch) -> P5 to Neck

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 5], 1, Concat, [1]]                   # 11 cat backbone P4 (layer 5)
  - [-1, 3, C2f, [512]]                         # 12 (128 ch)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 4], 1, Concat, [1]]                   # 14 cat backbone P3 (layer 4)
  - [-1, 3, C2f, [256]]                         # 15 (P3/8-small, 64 ch)

  - [-1, 1, Conv, [256, 3, 2]]                  # 16
  - [[-1, 12], 1, Concat, [1]]                  # 17 cat head P4 (layer 12)
  - [-1, 3, C2f, [512]]                         # 18 (P4/16-medium, 128 ch)

  - [-1, 1, Conv, [512, 3, 2]]                  # 19
  - [[-1, 9], 1, Concat, [1]]                   # 20 cat backbone SPPF P5 (layer 9)
  - [-1, 3, C2f, [1024]]                        # 21 (P5/32-large, 256 ch)

  - [[15, 18, 21], 1, Detect, [nc]]             # 22 Detect(P3, P4, P5)
